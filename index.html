  <style>
    /* ==========================================================================
       DESIGN TOKENS & FULL-PAGE BLOGGER OVERRIDE
       ========================================================================== */
    :root {
      --bg-canvas: #f8fafc;
      --bg-mesh-1: rgba(37, 99, 235, 0.08);
      --bg-mesh-2: rgba(14, 165, 233, 0.08);
      --glass-surface: rgba(255, 255, 255, 0.78);
      --glass-surface-strong: rgba(255, 255, 255, 0.92);
      --glass-border: rgba(226, 232, 240, 0.85);
      --glass-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-soft: #eff6ff;
      --accent: #0284c7;
      --success: #059669;
      --success-soft: #ecfdf5;
      --warning: #d97706;
      --warning-soft: #fffbeb;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --sidebar-width: 268px;
      --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Full Page Overlay untuk menutupi template Blogger 100% tanpa edit XML */
    #esurat-root-shell {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(at 0% 0%, var(--bg-mesh-1) 0px, transparent 50%),
        radial-gradient(at 100% 0%, var(--bg-mesh-2) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.05) 0px, transparent 50%);
      color: var(--text-main);
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar Styling */
    #esurat-root-shell::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    #esurat-root-shell::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 99px;
    }

    /* Glassmorphism Utilities */
    .glass-card {
      background: var(--glass-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: var(--radius-xl);
    }

    .glass-panel-strong {
      background: var(--glass-surface-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    /* Preview Banner */
    .preview-banner {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      color: #f8fafc;
      padding: 8px 16px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 1000010;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    .preview-badge {
      background: #f59e0b;
      color: #0f172a;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ==========================================================================
       LOGIN SCREEN
       ========================================================================== */
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      min-height: calc(100vh - 36px);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      position: relative;
      overflow: hidden;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1d4ed8, #0284c7);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px -5px rgba(29, 78, 216, 0.35);
      margin-bottom: 14px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(241, 245, 249, 0.9);
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 22px;
      border: 1px solid #e2e8f0;
    }

    .role-tab {
      border: none;
      background: transparent;
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: var(--transition);
    }

    .role-tab.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 13px;
      color: var(--text-light);
      pointer-events: none;
      display: flex;
    }

    .form-control {
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      border: 1px solid #cbd5e1;
      background: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      color: var(--text-main);
      transition: var(--transition);
      outline: none;
    }

    .form-control.has-icon {
      padding-left: 40px;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
      background: #ffffff;
    }

    textarea.form-control {
      min-height: 84px;
      resize: vertical;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: var(--transition);
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.22);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
      border-color: #cbd5e1;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .btn-soft {
      background: var(--primary-soft);
      color: var(--primary);
    }
    .btn-soft:hover:not(:disabled) {
      background: #dbeafe;
    }

    .btn-danger-soft {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .btn-danger-soft:hover:not(:disabled) {
      background: #fee2e2;
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-block {
      width: 100%;
    }

    .quick-login-box {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px dashed #cbd5e1;
    }

    .quick-login-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
      margin-bottom: 10px;
    }

    .quick-login-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* ==========================================================================
       APP SHELL (SIDEBAR DESKTOP & BOTTOM NAV MOBILE)
       ========================================================================== */
    .app-layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Desktop Fixed Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--glass-surface-strong);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 1000001;
    }

    .has-preview-banner .sidebar {
      top: 34px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 22px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .sidebar-brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1d4ed8, #0284c7);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      text-align: left;
      transition: var(--transition);
      width: 100%;
    }

    .nav-item:hover {
      background: rgba(241, 245, 249, 0.9);
      color: var(--text-main);
    }

    .nav-item.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 6px 16px -4px rgba(29, 78, 216, 0.35);
    }

    .sidebar-footer {
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    .user-profile-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .avatar-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 28px 32px 48px;
      max-width: calc(100vw - var(--sidebar-width));
    }

    .mobile-topbar {
      display: none;
    }

    .bottom-nav {
      display: none;
    }

    /* Page Header */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .page-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ==========================================================================
       DASHBOARD & DATA CARDS
       ========================================================================== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 24px;
    }

    .stat-card {
      padding: 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .stat-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.1;
    }

    .stat-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Toolbar & Filter */
    .toolbar-card {
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 380px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Table Styles */
    .table-card {
      overflow: hidden;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(248, 250, 252, 0.9);
      padding: 14px 18px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    td {
      padding: 15px 18px;
      font-size: 13.5px;
      color: var(--text-main);
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(248, 250, 252, 0.65);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-blue { background: #eff6ff; color: #1d4ed8; }
    .badge-green { background: #ecfdf5; color: #059669; }
    .badge-amber { background: #fffbeb; color: #d97706; }
    .badge-slate { background: #f1f5f9; color: #475569; }

    /* Gallery Grid for Bukti Upload */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .doc-card {
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: var(--transition);
    }
    .doc-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -6px rgba(15, 23, 42, 0.08);
    }

    .doc-preview-thumb {
      height: 140px;
      border-radius: 12px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .doc-preview-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Upload Dropzone */
    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      background: rgba(248, 250, 252, 0.7);
      cursor: pointer;
      transition: var(--transition);
    }
    .upload-zone:hover, .upload-zone.has-file {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    /* Empty State */
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #f1f5f9;
      color: var(--text-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    /* ==========================================================================
       MODAL & TOAST
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(6px);
      z-index: 1000020;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
      border: 1px solid #e2e8f0;
      animation: modalIn 0.2s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 18px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000050;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: #0f172a;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      animation: slideInRight 0.25s ease-out;
    }
    .toast.success { border-left: 4px solid #10b981; }
    .toast.error { border-left: 4px solid #ef4444; }
    .toast.info { border-left: 4px solid #3b82f6; }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ==========================================================================
       RESPONSIVE MEDIA QUERIES (MOBILE BOTTOM BAR & ADAPTIVE LAYOUT)
       ========================================================================== */
    @media (max-width: 1024px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none !important;
      }

      .mobile-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background: var(--glass-surface-strong);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--glass-border);
        position: sticky;
        top: 0;
        z-index: 1000002;
      }

      .main-content {
        margin-left: 0;
        max-width: 100vw;
        padding: 18px 16px 96px;
      }

      /* Floating Bottom Navigation Bar */
      .bottom-nav {
        display: flex;
        align-items: center;
        justify-content: space-around;
        position: fixed;
        bottom: 12px;
        left: 12px;
        right: 12px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(203, 213, 225, 0.9);
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
        border-radius: 18px;
        padding: 6px 4px;
        z-index: 1000005;
      }

      .bottom-nav-item {
        flex: 1;
        display: flex;

  // ==========================================================================
  // UTILITAS UI (TOAST, MODAL, FORMATTER)
  // ==========================================================================
  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const iconName = type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-circle' : 'info';
    toast.innerHTML = `<i data-lucide="${iconName}" style="width:18px;height:18px;"></i><span>${message}</span>`;
    container.appendChild(toast);
    lucide.createIcons();
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(20px)';
      toast.style.transition = 'all 0.25s ease';
      setTimeout(() => toast.remove(), 260);
    }, 3400);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatDateID(dateStr) {
    if (!dateStr) return '-';
    try {
      const d = new Date(dateStr);
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    } catch {
      return dateStr;
    }
  }

  window.openModal = function(htmlContent) {
    const box = document.getElementById('modal-content-box');
    box.innerHTML = htmlContent;
    document.getElementById('app-modal').classList.add('open');
    lucide.createIcons();
  };

  window.closeModal = function() {
    document.getElementById('app-modal').classList.remove('open');
    document.getElementById('modal-content-box').innerHTML = '';
  };

  // ==========================================================================
  // SISTEM AUTENTIKASI HYBRID (ADMIN SUPABASE AUTH & STAF TABEL DB)
  // ==========================================================================
  window.switchLoginRole = function(role) {
    state.loginRole = role;
    document.getElementById('tab-staf').classList.toggle('active', role === 'staf');
    document.getElementById('tab-admin').classList.toggle('active', role === 'admin');
    const label = document.getElementById('login-id-label');
    const input = document.getElementById('login-identifier');
    if (role === 'admin') {
      label.textContent = 'Email Administrator';
      input.type = 'email';
      input.placeholder = 'admin@instansi.go.id';
    } else {
      label.textContent = 'Username / NIP Staf';
      input.type = 'text';
      input.placeholder = 'Masukkan username staf';
    }
    input.value = '';
    document.getElementById('login-password').value = '';
  };

  window.quickPreviewLogin = function(role) {
    if (!IS_PREVIEW) return;
    if (role === 'admin') {
      state.user = {
        role: 'admin',
        name: 'Admin Tata Usaha',
        identifier: 'admin@instansi.go.id',
        divisi: 'Subbagian Tata Usaha'
      };
    } else {
      const sampleStaf = state.stafUsers[0] || { nama_lengkap: 'Staf Unit', username: 'staf01', divisi: 'Umum' };
      state.user = {
        role: 'staf',
        name: sampleStaf.nama_lengkap,
        identifier: sampleStaf.username,
        divisi: sampleStaf.divisi
      };
    }
    enterAppShell();
    showToast(`Berhasil masuk sebagai ${state.user.name} (Mode Preview)`, 'success');
  };

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = document.getElementById('login-identifier').value.trim();
    const password = document.getElementById('login-password').value.trim();
    const btn = document.getElementById('btn-login-submit');
    btn.disabled = true;

    try {
      if (IS_PREVIEW) {
        // Simulasi Login Lokal pada Mode Preview
        if (state.loginRole === 'admin') {
          state.user = {
            role: 'admin',
            name: 'Admin Tata Usaha',
            identifier: identifier || 'admin@preview.local',
            divisi: 'Tata Usaha'
          };
          enterAppShell();
          showToast('Login Admin berhasil (Mode Preview)', 'success');
        } else {
          const found = state.stafUsers.find(u => u.username === identifier && u.password === password);
          if (!found) throw new Error('Username atau password staf tidak cocok (Coba: staf01 / 123)');
          state.user = {
            role: 'staf',
            name: found.nama_lengkap,
            identifier: found.username,
            divisi: found.divisi
          };
          enterAppShell();
          showToast(`Selamat datang, ${found.nama_lengkap}`, 'success');
        }
      } else {
        // MODE PRODUKSI: 100% TERHUBUNG KE SUPABASE
        if (state.loginRole === 'admin') {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: identifier,
            password: password
          });
          if (error) throw error;
          state.user = {
            role: 'admin',
            name: data.user.email.split('@')[0].toUpperCase(),
            identifier: data.user.email,
            divisi: 'Administrator Utama'
          };
          localStorage.setItem('esurat_session', JSON.stringify(state.user));
          await enterAppShell();
          showToast('Login Administrator berhasil', 'success');
        } else {
          // Validasi User/Staf langsung ke tabel staf_users di Supabase
          const { data, error } = await supabase
            .from('staf_users')
            .select('*')
            .eq('username', identifier)
            .eq('password', password)
            .maybeSingle();

          if (error) throw error;
          if (!data) throw new Error('Username atau kata sandi staf tidak valid.');

          state.user = {
            role: 'staf',
            name: data.nama_lengkap,
            identifier: data.username,
            divisi: data.divisi
          };
          localStorage.setItem('esurat_session', JSON.stringify(state.user));
          await enterAppShell();
          showToast(`Selamat datang, ${data.nama_lengkap}`, 'success');

    document.getElementById('login-view').classList.add('hidden');

      el.classList.toggle('hidden', state.user.role !== 'admin');

    if (!IS_PREVIEW) {
      await fetchAllDataFromSupabase();

    window.navigate('dashboard');

  // ==========================================================================
  // SINKRONISASI DATA SUPABASE (CRUD & STORAGE UPLOAD)
  // ==========================================================================
  async function fetchAllDataFromSupabase() {
    if (IS_PREVIEW || !supabase) return;
    try {
      const [resMasuk, resKeluar, resStaf] = await Promise.all([
        supabase.from('surat_masuk').select('*').order('created_at', { ascending: false }),
        supabase.from('surat_keluar').select('*').order('created_at', { ascending: false }),
        state.user.role === 'admin'
          ? supabase.from('staf_users').select('*').order('created_at', { ascending: false })
          : Promise.resolve({ data: [] })
      ]);

      if (resMasuk.error) throw resMasuk.error;
      if (resKeluar.error) throw resKeluar.error;
      if (resStaf.error) throw resStaf.error;

      state.suratMasuk = resMasuk.data || [];
      state.suratKeluar = resKeluar.data || [];
      state.stafUsers = resStaf.data || [];
    } catch (err) {
      showToast('Gagal memuat data dari server: ' + err.message, 'error');
    }
  }

  async function uploadBuktiFile(file, folder) {
    if (!file) return { url: null, name: null };

    if (IS_PREVIEW) {
      // Konversi ke Data URL lokal untuk pratinjau langsung
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ url: reader.result, name: file.name });
        reader.readAsDataURL(file);
      });
    } else {
      // Upload ke Supabase Storage Bucket 'bukti-surat'
      const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const filePath = `${folder}/${Date.now()}_${cleanName}`;
      const { error: uploadError } = await supabase.storage
        .from(STORAGE_BUCKET)
        .upload(filePath, file, { cacheControl: '3600', upsert: false });

      if (uploadError) throw new Error('Gagal mengunggah file bukti: ' + uploadError.message);

      const { data: publicUrlData } = supabase.storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(filePath);

      return { url: publicUrlData.publicUrl, name: file.name };
    }
  }

  // ==========================================================================
  // NAVIGASI & RENDER HALAMAN
  // ==========================================================================
  window.navigate = function(menu) {
    if (menu === 'manajemen-staf' && state.user?.role !== 'admin') return;
    state.activeMenu = menu;
    state.searchQuery = '';
    state.filterStatus = 'ALL';

    document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.menu === menu);
    });

    renderCurrentView();
  };

  function renderCurrentView() {
    const container = document.getElementById('main-view-container');
    switch (state.activeMenu) {
      case 'dashboard':
        container.innerHTML = renderDashboard();
        break;
      case 'surat-masuk':
        container.innerHTML = renderSuratMasukPage();
        break;
      case 'surat-keluar':
        container.innerHTML = renderSuratKeluarPage();
        break;
      case 'galeri-bukti':
        container.innerHTML = renderGaleriBuktiPage();
        break;
      case 'manajemen-staf':
        container.innerHTML = renderManajemenStafPage();
        break;
    }
    lucide.createIcons();
  }

  // --------------------------------------------------------------------------
  // 1. VIEW: DASHBOARD RINGKASAN
  // --------------------------------------------------------------------------
  function renderDashboard() {
    const totalMasuk = state.suratMasuk.length;
    const totalKeluar = state.suratKeluar.length;

      state.suratMasuk.filter(s => s.bukti_url).length +
      state.suratKeluar.filter(s => s.bukti_url).length;

    const recentCombined = [
      ...state.suratMasuk.map(item => ({ ...item, jenis: 'Masuk', pihak: item.pengirim })),
      ...state.suratKeluar.map(item => ({ ...item, jenis: 'Keluar', pihak: item.tujuan }))

      .sort((a, b) => new Date(b.created_at || b.tanggal_surat) - new Date(a.created_at || a.tanggal_surat))

      <div class="stats-grid">

            <div class="stat-sub">Total agenda diterima</div>

          <div class="stat-icon" style="background:#eff6ff; color:#1d4ed8;">
            <i data-lucide="inbox" style="width:22px;height:22px;"></i>
          </div>
        </div>

        <div class="glass-card stat-card">
          <div>
            <div class="stat-label">Surat Keluar</div>
            <div class="stat-value">${totalKeluar}</div>
            <div class="stat-sub">Total agenda dikirim</div>
          </div>
          <div class="stat-icon" style="background:#ecfdf5; color:#059669;">
            <i data-lucide="send" style="width:22px;height:22px;"></i>
          </div>
        </div>

        <div class="glass-card stat-card">
          <div>
            <div class="stat-label">Bukti Terunggah</div>
            <div class="stat-value">${totalBukti}</div>

            <i data-lucide="file-check-2" style="width:22px;height:22px;"></i>

        </div>

        <div class="glass-card stat-card">

            <div class="stat-label">Rasio Kelengkapan</div>
            <div class="stat-value">${totalArsip > 0 ? Math.round((totalBukti / totalArsip) * 100) : 0}%</div>
            <div class="stat-sub">Arsip berlampiran bukti</div>

          <div class="stat-icon" style="background:#f3e8ff; color:#7e22ce;">

                <table>

                    <tr>

                      <th>No. Agenda & Surat</th>
                      <th>Pengirim / Tujuan</th>
                      <th>Perihal</th>
                      <th>Tanggal</th>
                      <th>Bukti</th>
                    </tr>
                  </thead>
                  <tbody>

                      <tr>

  // --------------------------------------------------------------------------
  // 4. VIEW: GALERI BUKTI UPLOAD & ARSIP DIGITAL
  // --------------------------------------------------------------------------
  function renderGaleriBuktiPage() {
    const q = state.searchQuery.toLowerCase();
    const allDocs = [
      ...state.suratMasuk.filter(s => s.bukti_url).map(s => ({ ...s, kategori: 'Surat Masuk', pihak: s.pengirim })),
      ...state.suratKeluar.filter(s => s.bukti_url).map(s => ({ ...s, kategori: 'Surat Keluar', pihak: s.tujuan }))
    ].filter(doc => {
      const matchType = state.filterGalleryType === 'ALL' || doc.kategori === state.filterGalleryType;
      const matchText =
        doc.no_surat.toLowerCase().includes(q) ||
        doc.perihal.toLowerCase().includes(q) ||
        doc.pihak.toLowerCase().includes(q) ||
        (doc.nama_file || '').toLowerCase().includes(q);
      return matchType && matchText;
    });

    return `
      <div class="page-header">
        <div>
          <h2 class="page-title">Galeri Bukti Upload & Arsip</h2>
          <p class="page-desc">Kumpulan dokumen hasil pindai (scan), foto tanda terima, dan lampiran bukti surat.</p>
        </div>
      </div>

      <div class="glass-card toolbar-card">
        <div class="search-box">
          <span class="input-icon"><i data-lucide="search" style="width:16px;height:16px;"></i></span>
          <input type="text" class="form-control has-icon" placeholder="Cari nama file, nomor surat, atau perihal..."
            value="${escapeHtml(state.searchQuery)}"
            oninput="window.updateSearch(this.value)" />
        </div>
        <div class="filter-group">
          <select class="form-control" style="width:auto;" onchange="state.filterGalleryType=this.value; renderCurrentView();">
            <option value="ALL" ${state.filterGalleryType === 'ALL' ? 'selected' : ''}>Semua Kategori</option>
            <option value="Surat Masuk" ${state.filterGalleryType === 'Surat Masuk' ? 'selected' : ''}>Bukti Surat Masuk</option>
            <option value="Surat Keluar" ${state.filterGalleryType === 'Surat Keluar' ? 'selected' : ''}>Bukti Surat Keluar</option>
          </select>
        </div>
      </div>

      ${
        allDocs.length === 0
          ? `<div class="glass-card empty-state">
              <div class="empty-icon"><i data-lucide="folder-search" style="width:26px;height:26px;"></i></div>
              <div style="font-weight:700; color:var(--text-main);">Belum ada file bukti yang diunggah</div>
              <p style="font-size:13px; margin-top:4px;">Unggah file PDF atau gambar bukti saat mencatat Surat Masuk maupun Surat Keluar.</p>
            </div>`
          : `<div class="gallery-grid">
              ${allDocs.map(doc => {
                const isPdf = (doc.nama_file || doc.bukti_url).toLowerCase().includes('.pdf');
                return `
                  <div class="glass-card doc-card">
                    <div>
                      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span class="badge ${doc.kategori === 'Surat Masuk' ? 'badge-blue' : 'badge-green'}">${doc.kategori}</span>
                        <span style="font-size:11.5px; color:var(--text-muted);">${formatDateID(doc.tanggal_surat)}</span>
                      </div>
                      <div class="doc-preview-thumb" onclick="window.previewDocument('${escapeHtml(doc.bukti_url)}', '${escapeHtml(doc.nama_file || doc.no_surat)}')">
                        ${isPdf
                          ? `<i data-lucide="file-text" style="width:38px;height:38px;color:#dc2626;margin-bottom:6px;"></i>
                             <span style="font-size:12px;font-weight:700;color:var(--text-main);">Dokumen PDF</span>`
                          : `<img src="${escapeHtml(doc.bukti_url)}" alt="Bukti Surat" />`
                        }
                      </div>
                      <div style="margin-top:12px;">
                        <div style="font-size:12px; font-weight:700; color:var(--primary);">${escapeHtml(doc.no_surat)}</div>
                        <div style="font-size:14px; font-weight:700; margin:3px 0; line-height:1.35;">${escapeHtml(doc.perihal)}</div>
                        <div style="font-size:12px; color:var(--text-muted);">${escapeHtml(doc.pihak)}</div>
                      </div>
                    </div>
                    <div style="display:flex; gap:8px; padding-top:10px; border-top:1px solid #f1f5f9;">
                      <button class="btn btn-soft btn-sm btn-block" onclick="window.previewDocument('${escapeHtml(doc.bukti_url)}', '${escapeHtml(doc.nama_file || doc.no_surat)}')">
                        <i data-lucide="maximize-2" style="width:14px;height:14px;"></i> Pratinjau File
                      </button>
                      <a href="${escapeHtml(doc.bukti_url)}" download="${escapeHtml(doc.nama_file || 'bukti-surat')}" target="_blank" class="btn btn-secondary btn-sm" title="Unduh">
                        <i data-lucide="download" style="width:14px;height:14px;"></i>
                      </a>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>`
      }
    `;
  }

  // ==========================================================================
  // INISIALISASI AWAL SAAT HALAMAN DIMUAT
  // ==========================================================================
  async function bootstrapApp() {
    if (IS_PREVIEW) {
      document.getElementById('esurat-root-shell').classList.add('has-preview-banner');
      document.getElementById('preview-banner').classList.remove('hidden');
      document.getElementById('preview-quick-login').classList.remove('hidden');
      initPreviewDummyData();
    } else {
      // Pastikan elemen preview 100% tersembunyi & cek sesi login aktif
      document.getElementById('preview-banner').remove();
      document.getElementById('preview-quick-login').remove();

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) {
          state.user = {
            role: 'admin',
            name: session.user.email.split('@')[0].toUpperCase(),
            identifier: session.user.email,
            divisi: 'Administrator Utama'
          };
          await enterAppShell();
          lucide.createIcons();
          return;
        }

        const savedStaf = localStorage.getItem('esurat_session');
        if (savedStaf) {
          const parsed = JSON.parse(savedStaf);
          if (parsed && parsed.role === 'staf') {
            state.user = parsed;
            await enterAppShell();
            lucide.createIcons();
            return;
          }
        }
      } catch (e) {
        console.error('Session check error:', e);
      }
    }

    lucide.createIcons();
  }

  bootstrapApp();
</script>
</body>
</html>
